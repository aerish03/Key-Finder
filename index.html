
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111">
<title>SongBPM Quick Finder</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#101010;color:#f5f5f5;font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:20px}
main{max-width:680px;margin:0 auto;padding-top:7vh}.card{background:#1c1c1c;border:1px solid #303030;border-radius:24px;padding:25px;box-shadow:0 18px 55px #0008}
h1{margin:0 0 7px;font-size:29px}.sub{margin:0 0 22px;color:#aaa}
form{display:flex;gap:10px}.q{flex:1;min-width:0;background:#101010;border:1px solid #494949;border-radius:13px;padding:16px;color:#fff;font-size:17px;outline:none}.q:focus{border-color:#aaa}
button{border:0;border-radius:13px;padding:0 20px;background:#fff;color:#111;font-size:16px;font-weight:800}
#status{min-height:22px;margin-top:17px;color:#999;font-size:14px}.error{color:#ffaaaa}
.result{margin-top:12px;padding:17px;border:1px solid #343434;border-radius:16px;background:#111}.title{font-size:19px;font-weight:800}.artist{color:#aaa;margin-top:3px}
.stats{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.stat{min-width:92px;background:#202020;border-radius:11px;padding:10px 13px}.label{font-size:11px;color:#888}.value{font-size:19px;font-weight:800;margin-top:2px}
.open{display:inline-block;margin-top:13px;color:#ddd;text-decoration:none;font-size:13px}.footer{margin-top:18px;color:#666;font-size:12px;line-height:1.5}
@media(max-width:520px){form{flex-direction:column}button{height:50px}}
</style>
</head>
<body>
<main><section class="card">
<h1>🎵 SongBPM Quick Finder</h1>
<p class="sub">Search SongBPM and get the BPM + key without opening the site manually.</p>
<form id="searchForm">
<input id="q" class="q" type="search" placeholder="e.g. Choo Lo" autocomplete="off" autofocus required>
<button id="btn">Search</button>
</form>
<div id="status"></div>
<div id="results"></div>
<div class="footer">Results are fetched by the backend directly from SongBPM. Select the exact recording when multiple versions appear.</div>
</section></main>
<script>
const form=document.getElementById('searchForm'), q=document.getElementById('q');
const status=document.getElementById('status'), results=document.getElementById('results'), btn=document.getElementById('btn');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
form.addEventListener('submit',async e=>{
 e.preventDefault(); const query=q.value.trim(); if(!query)return;
 btn.disabled=true; status.textContent='Searching SongBPM…'; results.innerHTML='';
 try{
   const r=await fetch('/api/search?q='+encodeURIComponent(query),{headers:{Accept:'application/json'}});
   const data=await r.json();
   if(!r.ok) throw new Error(data.error||'Search failed');
   if(!data.results?.length){status.innerHTML='<span class="error">No SongBPM results found. Try adding the artist name.</span>';return;}
   status.textContent=`${data.results.length} result${data.results.length===1?'':'s'} found`;
   results.innerHTML=data.results.map(x=>`<article class="result">
      <div class="title">${esc(x.title)}</div><div class="artist">${esc(x.artist)}</div>
      <div class="stats">
       <div class="stat"><div class="label">BPM</div><div class="value">${esc(x.bpm)}</div></div>
       <div class="stat"><div class="label">KEY</div><div class="value">${esc(x.key||'Not listed')}</div></div>
      </div>
      <a class="open" href="${esc(x.url)}" target="_blank" rel="noopener">Open SongBPM result ↗</a>
   </article>`).join('');
 }catch(err){status.innerHTML='<span class="error">'+esc(err.message)+'</span>';}
 finally{btn.disabled=false;}
});
</script>
</body>
</html>
